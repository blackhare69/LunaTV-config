name: Fork-sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * *"  # 每天北京时间凌晨1点运行 (UTC 17点)
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        env:
          UPSTREAM_REPO: hafrey1/LunaTV-config
        run: |
          set -euo pipefail

          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main
          git checkout main

          # Upstream is authoritative. This also resolves generated-file conflicts
          # in favour of the upstream README.md and report.md.
          git merge --no-edit -X theirs upstream/main

          # A fork must consume upstream-generated reports instead of generating
          # its own competing README.md/report.md commits.
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-check-encode.yml")
          gate = (
              "    # Forks consume upstream-generated artifacts; do not create divergent commits.\n"
              "    if: ${{ github.repository == 'hafrey1/LunaTV-config' }}\n"
          )
          marker = "  build-check-encode:\n"

          if workflow.exists():
              text = workflow.read_text()
              if "github.repository == 'hafrey1/LunaTV-config'" not in text:
                  if marker not in text:
                      raise SystemExit("build-check-encode.yml format changed; refusing an unsafe sync")
                  workflow.write_text(text.replace(marker, marker + gate, 1))
          PY

          if ! git diff --quiet -- .github/workflows/build-check-encode.yml; then
            git add .github/workflows/build-check-encode.yml
            git commit -m "ci: keep report generation disabled in fork"
          fi

          git push origin HEAD:main

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Upstream sync failed. The workflow now resolves generated-file conflicts in favour of upstream."
          echo "[Error] If this fails again, inspect the sync log for an upstream workflow format change."
          exit 1

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 5
